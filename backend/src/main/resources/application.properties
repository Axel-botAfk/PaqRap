server.address=${PAQRAP_BIND_ADDRESS:127.0.0.1}
server.port=${PAQRAP_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=64KB
spring.servlet.multipart.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false
paqrap.data-dir=${PAQRAP_DATA_DIR:codigo/paqrap/datos/reales}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
# Operación día a día en tiempo real: arranca en el minuto presente, avanza 1x y admite
# pedidos por POST /api/ejecuciones/{id}/pedidos mientras corre.
# Rollback: poner false (o PAQRAP_TIEMPO_REAL=false) y el día a día vuelve a 60x con inicio
# elegido en la pantalla. Hay que apagar también TIEMPO_REAL_DIA_A_DIA en frontend/src/formato.js.
paqrap.operacion.tiempo-real=${PAQRAP_TIEMPO_REAL:true}
