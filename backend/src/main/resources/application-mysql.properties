# Activar junto con el perfil Maven mysql: -Pmysql y --spring.profiles.active=mysql.
# Crear previamente el esquema database/paqrap_mysql.sql en MySQL Workbench.
spring.datasource.url=${PAQRAP_DB_URL:jdbc:mysql://127.0.0.1:3306/paqrap}
spring.datasource.username=${PAQRAP_DB_USER}
spring.datasource.password=${PAQRAP_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
