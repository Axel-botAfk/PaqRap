# Sitio de PaqRap (parte HTTP).
# Certbot agrega automáticamente el bloque HTTPS y la redirección.
server {
    listen 80;
    server_name 1inf54-982-2b.inf.pucp.edu.pe;
    root /var/www/paqrap;
    index index.html;

    # Frontend (React compilado)
    location / { try_files $uri /index.html; }

    # API REST -> backend
    location /api/ {
        proxy_pass http://127.0.0.1:8081;   # sin "/" final: conserva el prefijo /api
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    # WebSocket -> backend (la simulación mantiene la conexión abierta)
    location /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
